<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Border subtle highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#818cf8" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Chime Bell Graphic -->
  <g filter="url(#shadow)" transform="translate(106, 80) scale(0.6)">
    <!-- Sound Waves Top Right -->
    <path d="M 380 90 A 60 60 0 0 1 420 150" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M 405 65 A 95 95 0 0 1 465 160" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Bell Dome -->
    <path d="M 250 80 C 170 80 140 160 130 250 L 100 310 C 90 330 105 350 130 350 L 370 350 C 395 350 410 330 400 310 L 370 250 C 360 160 330 80 250 80 Z" fill="url(#goldGrad)" />
    
    <!-- Bell Top Loop -->
    <circle cx="250" cy="65" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    
    <!-- Bell Clapper -->
    <circle cx="250" cy="385" r="32" fill="#d97706" />
    
    <!-- Under Base Plate (Table/Pedestal) -->
    <rect x="80" y="440" width="340" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" />
    <path d="M 120 464 L 100 510 L 400 510 L 380 464 Z" fill="#ffffff" fill-opacity="0.75" />
  </g>
  
  <!-- Brand Wordmark Base -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">MESAYA</text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#a5b4fc" letter-spacing="2">STAFF PWA</text>
</svg>
