# MesaYA — Release controlada de migraciones (MANUAL, separada del build/preview).
#
# - Sólo ejecución manual (`workflow_dispatch`) contra el entorno `production`.
# - La operación por defecto es un preflight de sólo lectura; la migración se
#   selecciona explícitamente como `operation=migrate`.
# - Aplica ÚNICAMENTE el historial revisado con `migrate deploy` mediante
#   `scripts/postgres-migrate.mjs`, que exige MESAYA_PG_DATABASE_URL y
#   MESAYA_PG_DIRECT_URL explícitas y no acepta DATABASE_URL/DIRECT_URL.
# - PROHIBIDO en este workflow: seed, `db push`, `migrate dev/reset`.
#   Ver docs/DEPLOY_VERCEL_SUPABASE.md y docs/implementacion/SCRIPTS_AUDITADOS.md.
name: release-migrate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operación cloud: preflight de sólo lectura o migración'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - migrate

jobs:
  preflight:
    if: ${{ inputs.operation == 'preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      MESAYA_PG_DATABASE_URL: ${{ secrets.MESAYA_PG_DATABASE_URL }}
      MESAYA_PG_DIRECT_URL: ${{ secrets.MESAYA_PG_DIRECT_URL }}
      PGCONNECT_TIMEOUT: '15'
    steps:
      - name: Validar destino PostgreSQL sin mutaciones
        shell: bash
        run: |
          set -euo pipefail

          test -n "${MESAYA_PG_DATABASE_URL}" || { echo "Falta MESAYA_PG_DATABASE_URL"; exit 2; }
          test -n "${MESAYA_PG_DIRECT_URL}" || { echo "Falta MESAYA_PG_DIRECT_URL"; exit 2; }
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          runtime_db="$(psql "${MESAYA_PG_DATABASE_URL}" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT current_database()')"
          direct_db="$(psql "${MESAYA_PG_DIRECT_URL}" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT current_database()')"
          test -n "${runtime_db}" || { echo "La conexión runtime no devolvió identidad de base"; exit 1; }
          test "${runtime_db}" = "${direct_db}" || { echo "Las conexiones runtime y directa no apuntan a la misma base"; exit 1; }

          migration_table="$(psql "${MESAYA_PG_DIRECT_URL}" -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT CASE WHEN to_regclass('public._prisma_migrations') IS NULL THEN 'MISSING' ELSE 'PRESENT' END")"
          test "${migration_table}" = "PRESENT" || { echo "Falta public._prisma_migrations en el destino"; exit 1; }

          missing_core="$(psql "${MESAYA_PG_DIRECT_URL}" -X -A -t -v ON_ERROR_STOP=1 -c "
            SELECT count(*)
            FROM (VALUES
              ('Restaurant'), ('Table'), ('TableSession'), ('Order'),
              ('OrderItem'), ('PaymentTransaction'), ('StaffUser'), ('Shift'),
              ('AccountSettlement'), ('ReceiptSnapshot'), ('TableStateEvent')
            ) AS required(table_name)
            WHERE to_regclass('public.' || quote_ident(required.table_name)) IS NULL
          ")"
          test "${missing_core}" = "0" || { echo "Faltan tablas núcleo del contrato MesaYA"; exit 1; }

          # No se imprimen hosts, URLs, usuarios, filas ni datos.
          echo "CLOUD_PREFLIGHT=PASS"
          echo "CONNECTION_TARGET_MATCH=PASS"
          echo "PRISMA_MIGRATION_TABLE=PRESENT"
          echo "CORE_SCHEMA=PASS"

  migrate:
    if: ${{ inputs.operation == 'migrate' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia reproducible
        run: npm ci
      - name: Aplicar migraciones revisadas (deploy, sin seed)
        env:
          MESAYA_PG_DATABASE_URL: ${{ secrets.MESAYA_PG_DATABASE_URL }}
          MESAYA_PG_DIRECT_URL: ${{ secrets.MESAYA_PG_DIRECT_URL }}
        run: npm --workspace=@mesaya/api run prisma:postgres:migrate
